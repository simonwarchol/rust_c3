[package]
name = "rust_c3"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "C3 for Rust"
homepage = "https://www.github.com/simonwarchol/rust_c3"    # project home page, if any
repository = "https://www.github.com/simonwarchol/rust_c3" # project repository, if any
# Ship sources + bundled C3 `.npy` data (~3 MiB; crates.io limit 10 MiB). Omit git-tracked `target/`.
include = [
    "README.md",
    "src/**/*.rs",
    "src/c3_color.npy",
    "src/c3_a.npy",
    "src/c3_t.npy",
    "benches/**/*",
    "tests/**/*",
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kd-tree = "0.5.1"
ndarray = "0.15.6"
ndarray-npy = "0.8.1"
typenum = "1.16.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "c3_bench"
harness = false
